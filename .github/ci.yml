name: Flask & MySQL CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: dblib
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize Database Schema
      run: |
        # Inject the schema.sql into our live test database container
        mysql -h 127.0.0.1 -P 3306 -u root -proot_password dblib < schema.sql

    - name: Run Basic Flask Validation
      env:
        SECRET_KEY: ci-testing-secret-key-12345
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: root_password
        MYSQL_DATABASE: dblib
      run: |
        # Verifies the Flask application factory compiles and loads cleanly
        python -c "from library_app import create_app; app = create_app(); print('App built successfully!')"
